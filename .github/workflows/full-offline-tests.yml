name: Full offline protocol suite
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download exact vendor test fixtures
        run: python3 tools/fetch_test_fixtures.py
      - name: Build universal app
        run: sh build.sh
      - name: Run offline suite (no USB device access)
        run: sh test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Offline-validation-results
          path: |
            build/*tests.json
            build/*test-log.txt
            build/ui-validation/
