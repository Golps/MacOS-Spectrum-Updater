name: Publish macOS release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create at the selected source commit
        required: true
        default: v1.0.0
        type: string

jobs:
  validate:
    permissions:
      contents: read
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate tag input
        run: |
          python3 - <<'PYCODE'
          import os, re
          if not re.fullmatch(r'v\d+\.\d+(?:\.\d+)?', os.environ['RELEASE_TAG']):
              raise SystemExit('Use a release tag such as v1.0.0')
          PYCODE
      - name: Download exact vendor test fixtures
        run: python3 tools/fetch_test_fixtures.py
      - name: Build and run the full offline safety suite
        run: |
          sh build.sh
          sh test.sh
      - name: Package app and prepare release notes
        run: |
          task_app_version=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist", "rb"))["CFBundleShortVersionString"])')
          python3 tools/package_github_release.py --version "$task_app_version"
          python3 - <<'PYCODE'
          from pathlib import Path
          import plistlib, re, posixpath, os
          version = plistlib.loads(Path('Info.plist').read_bytes())['CFBundleShortVersionString']
          tag = os.environ['RELEASE_TAG'].removeprefix('v')
          if tag not in {version, version + '.0'}:
              raise SystemExit('Release tag must match the app version')
          source = Path('docs/releases') / (version + '.md')
          if not source.exists():
              raise SystemExit('Create release notes for this app version first')
          def absolute(match):
              label, target = match.group(1), match.group(2)
              if target.startswith(('https://', 'http://', '#', 'mailto:')):
                  return match.group(0)
              path = posixpath.normpath(str(source.parent / target))
              return '[' + label + '](https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/blob/' + os.environ['GITHUB_SHA'] + '/' + path + ')'
          Path('build/release-notes.md').write_text(re.sub(r'\[([^\]]+)\]\(([^)]+)\)', absolute, source.read_text()))
          PYCODE
          mkdir -p build/publish
          cp build/release/* build/publish/
          cp build/release-notes.md build/publish/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle
          path: build/publish/

  publish:
    needs: validate
    permissions:
      contents: write
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle
          path: build/publish
      - name: Publish validated release assets
        run: |
          gh release create "$RELEASE_TAG" build/publish/Spectrum-Updater-*-macOS.zip build/publish/SHA256SUMS.txt build/publish/package-report.json \
            --target "$GITHUB_SHA" \
            --title "Spectrum Updater ${RELEASE_TAG#v}" \
            --notes-file build/publish/release-notes.md
